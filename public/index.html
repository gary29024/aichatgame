<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#120d1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kindred">
  <meta name="referrer" content="no-referrer">
  <title>Kindred</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- Home: pick a character -->
    <section id="home" class="screen">
      <header class="topbar">
        <h1>Kindred <span data-i18n="appTagline">AI story chat</span></h1>
        <button id="btn-settings" class="icon" aria-label="Settings">⚙︎</button>
      </header>
      <div id="key-banner" class="banner" hidden></div>
      <div id="char-grid" class="grid"></div>
    </section>

    <!-- Chat with one character -->
    <section id="chat" class="screen" hidden>
      <header class="chat-top">
        <button id="btn-back" class="icon" aria-label="Back">‹</button>
        <div id="chat-avatar" class="avatar"></div>
        <div class="who">
          <div id="chat-name"></div>
          <div id="chat-mood"></div>
        </div>
        <button id="btn-gallery" class="icon small" aria-label="Gallery">🖼️</button>
        <button id="btn-menu" class="icon" aria-label="Menu">⋯</button>
      </header>
      <div id="affection" class="affection" title="Affection">
        <span class="heart">♥</span>
        <div class="bar"><div id="aff-fill"></div></div>
        <span id="aff-label"></span>
        <span id="aff-num"></span>
      </div>
      <div id="messages"></div>
      <div id="suggestions"></div>
      <form id="composer" autocomplete="off">
        <textarea id="input" rows="1" data-i18n-ph="inputPlaceholder" placeholder="Say something… use *asterisks* for actions"></textarea>
        <button id="send" type="submit" class="primary" aria-label="Send">➤</button>
      </form>
    </section>

    <!-- Gallery: special memories and story pictures -->
    <section id="gallery" class="screen" hidden>
      <header class="chat-top">
        <button id="btn-gallery-back" class="icon" aria-label="Back">‹</button>
        <div class="who">
          <div id="gallery-name"></div>
          <div id="gallery-count"></div>
        </div>
      </header>
      <div id="gallery-body"></div>
    </section>
  </main>

  <dialog id="modal"><form id="modal-form" novalidate></form></dialog>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
